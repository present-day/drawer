name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".storybook/**"
      - "stories/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-storybook
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Match `packageManager` so the lockfile format agrees with local installs.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Storybook builds with relative asset paths, so it works from the
      # Pages subpath without extra config.
      - run: bun run storybook:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
